[project]
name = "clipforge-backend"
version = "0.1.0"
description = "ClipForge Local sidecar"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.6",
    "httpx2==2.16.0",
    "pydantic==2.14.3",
    "sqlalchemy==2.1.8",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "clipforge"
