# Virtual uv workspace root (ADR 012): uv.lock and .venv live here, the single
# member is apps/backend. Tool configuration for ruff, mypy and pytest is also
# here because the gates run from the repository root.

[tool.uv.workspace]
members = ["apps/backend"]

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pyinstaller==6.22.3",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "ASYNC", "RUF", "PT"]
# User-facing text is Ukrainian: Cyrillic letters are not "ambiguous" here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"apps/backend/tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["apps/backend/tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # FastAPI (fastapi/dependencies/utils.py analyze_param) sets `alias` on the FieldInfo of every
    # Query/Header/Path/Cookie parameter, which makes pydantic >= 2.12 warn; ModelField.__post_init__
    # silences it with warnings.catch_warnings(), which is not thread-safe. FastAPI builds each app's
    # routes on its first request, so parallel first requests in tests (one app per thread) strip the
    # silencing from each other and the warning becomes a 500. Only the `alias` message of this class
    # is ignored: every other unused Field() attribute that pydantic reports still fails the tests.
    "ignore:The 'alias' attribute with value:pydantic.warnings.UnsupportedFieldAttributeWarning",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["clipforge"]
omit = ["*/clipforge/storage/migrations/*"]

[tool.coverage.report]
show_missing = true
